<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Example Zoned Security dashboard</title>
  <desc id="desc">A sanitized Home Assistant dashboard layout for a zoned alarm workflow.</desc>
  <rect width="1280" height="360" fill="#fafafa"/>
  <style>
    .section{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1f1f1f}
    .card{fill:#fff;stroke:#dedede;stroke-width:1}
    .title{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#202124}
    .sub{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#333}
    .muted{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#666}
    .activity{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#222}
    .time{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#666}
  </style>

  <text class="section" x="20" y="30">Status</text>
  <text class="section" x="335" y="30">Zones</text>
  <text class="section" x="650" y="30">Workflow</text>
  <text class="section" x="960" y="30">Activity</text>

